<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>logitcat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #1f2937;
      --surface3:    #273244;
      --border:      #30363d;
      --border2:     #3d4a5c;
      --text:        #e6edf3;
      --text-muted:  #7d8590;
      --text-dim:    #adbac7;
      --accent:      #58a6ff;
      --critical:    #f85149;
      --critical-bg: rgba(248,81,73,.1);
      --warn:        #e3b341;
      --warn-bg:     rgba(227,179,65,.1);
      --info:        #58a6ff;
      --info-bg:     rgba(88,166,255,.1);
      --ok:          #3fb950;
      --ok-bg:       rgba(63,185,80,.1);
      --radius:      8px;
      --mono:        'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,monospace;
    }
    html { font-size: 14px; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 54px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 17px; font-weight: 700; letter-spacing: -.4px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
      background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(63,185,80,.3);
    }
    .pill.offline { background: var(--critical-bg); color: var(--critical); border-color: rgba(248,81,73,.3); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 5px currentColor; animation: blink 2s infinite; }
    .pill.offline .dot { animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .uptime-badge { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); transition: all .15s; }
    .btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .btn-primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
    .btn-primary:hover { background: #79c0ff; border-color: #79c0ff; }

    /* ── Layout ── */
    .layout { display: grid; grid-template-columns: 1fr 300px; gap: 0; height: calc(100vh - 54px); }
    @media(max-width:860px){ .layout{ grid-template-columns:1fr; } }

    /* ── Stats strip ── */
    .stats-strip {
      display: grid; grid-template-columns: repeat(4,1fr);
      border-bottom: 1px solid var(--border);
    }
    .stat {
      padding: 14px 20px; border-right: 1px solid var(--border);
      transition: background .15s;
    }
    .stat:last-child { border-right: none; }
    .stat:hover { background: var(--surface2); }
    .stat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin-bottom: 6px; }
    .stat-val { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-val.red  { color: var(--critical); }
    .stat-val.green{ color: var(--ok); }
    .stat-val.blue { color: var(--accent); }
    .stat-sub { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

    /* ── Left panel ── */
    .left-panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .filter { padding: 4px 11px; border-radius: 999px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--text-muted); transition: all .12s; }
    .filter:hover { background: var(--surface2); color: var(--text); }
    .filter.on { background: var(--surface2); color: var(--text); border-color: var(--border2); }
    .filter.on.fc { background: var(--critical-bg); color: var(--critical); border-color: rgba(248,81,73,.4); }
    .filter.on.fw { background: var(--warn-bg);     color: var(--warn);     border-color: rgba(227,179,65,.4); }
    .filter.on.fi { background: var(--info-bg);     color: var(--info);     border-color: rgba(88,166,255,.4); }
    .spacer { flex: 1; }
    .count-label { font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; transition: all .12s; }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }

    /* ── Feed ── */
    .feed { flex: 1; overflow-y: auto; padding: 8px; }
    .feed::-webkit-scrollbar { width: 4px; }
    .feed::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── Alert card ── */
    .alert-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      overflow: hidden;
      transition: border-color .15s;
      animation: pop .18s ease-out;
    }
    @keyframes pop { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
    .alert-card:hover { border-color: var(--border2); }
    .alert-card.CRITICAL { border-left: 3px solid var(--critical); }
    .alert-card.WARN     { border-left: 3px solid var(--warn); }
    .alert-card.INFO     { border-left: 3px solid var(--info); }

    .alert-head {
      display: grid;
      grid-template-columns: auto auto auto 1fr auto auto;
      align-items: center; gap: 8px;
      padding: 9px 12px;
      cursor: pointer;
      background: var(--surface);
      transition: background .12s;
    }
    .alert-head:hover { background: var(--surface2); }

    /* severity badge */
    .sev { padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
    .sev-CRITICAL { background: var(--critical-bg); color: var(--critical); }
    .sev-WARN     { background: var(--warn-bg);     color: var(--warn); }
    .sev-INFO     { background: var(--info-bg);     color: var(--info); }

    /* format badge */
    .fmt { padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; background: var(--surface3); color: var(--text-muted); border: 1px solid var(--border); white-space: nowrap; font-family: var(--mono); }
    .fmt-json    { color: #7ee787; border-color: rgba(126,231,135,.3); }
    .fmt-syslog  { color: #d2a8ff; border-color: rgba(210,168,255,.3); }
    .fmt-apache  { color: #ffa657; border-color: rgba(255,166,87,.3); }

    /* rule tag */
    .rule-tag { padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; background: var(--surface3); color: var(--text-muted); border: 1px solid var(--border); white-space: nowrap; }

    /* message */
    .alert-msg { font-family: var(--mono); font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

    /* time */
    .alert-time { font-family: var(--mono); font-size: 10px; color: var(--text-muted); white-space: nowrap; }

    /* chevron */
    .chevron { font-size: 10px; color: var(--text-muted); transition: transform .2s; flex-shrink: 0; }
    .alert-card.open .chevron { transform: rotate(90deg); }

    /* ── Expanded detail ── */
    .alert-detail {
      display: none;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      font-size: 12px;
    }
    .alert-card.open .alert-detail { display: block; }

    .detail-grid { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; margin-bottom: 12px; }
    .dk { font-weight: 600; color: var(--text-muted); font-family: var(--mono); font-size: 11px; padding: 3px 0; }
    .dv { font-family: var(--mono); font-size: 11px; color: var(--text-dim); padding: 3px 0; word-break: break-all; }
    .dv.red   { color: var(--critical); }
    .dv.amber { color: var(--warn); }
    .dv.blue  { color: var(--accent); }
    .dv.green { color: var(--ok); }

    .fields-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
      color: var(--text-muted); margin-bottom: 8px; margin-top: 4px;
      border-top: 1px solid var(--border); padding-top: 10px;
    }
    .fields-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 6px; }
    .field-chip {
      display: flex; gap: 6px; align-items: baseline;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 5px 9px;
    }
    .field-k { font-family: var(--mono); font-size: 10px; color: var(--accent); font-weight: 600; flex-shrink: 0; }
    .field-v { font-family: var(--mono); font-size: 11px; color: var(--text-dim); word-break: break-all; }

    .raw-block {
      margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px;
    }
    .raw-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 6px; }
    .raw-text {
      background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
      padding: 8px 12px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
      word-break: break-all; white-space: pre-wrap; line-height: 1.6;
    }
    .copy-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .copy-val { font-family: var(--mono); font-size: 11px; color: var(--text-dim); word-break: break-all; flex: 1; }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text-muted);
      transition: all .15s; white-space: nowrap; flex-shrink: 0;
    }
    .copy-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .copy-btn.copied { background: var(--ok-bg); color: var(--ok); border-color: rgba(63,185,80,.4); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 36px; opacity: .25; margin-bottom: 12px; }
    .empty p { font-size: 13px; }

    /* ── Right sidebar ── */
    .sidebar { overflow-y: auto; background: var(--surface); }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .section { border-bottom: 1px solid var(--border); }
    .section-head { padding: 11px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; }
    .section-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; font-family: var(--mono); font-size: 10px; color: var(--text-muted); }

    .rule-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-top: 1px solid var(--border); transition: background .12s; }
    .rule-row:hover { background: var(--surface2); }
    .rule-info { }
    .rule-name { font-size: 12px; font-weight: 500; color: var(--text); }
    .rule-sev  { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .rule-n    { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text-muted); }
    .rule-n.hot { color: var(--critical); }

    .file-row { display: flex; align-items: flex-start; gap: 9px; padding: 9px 16px; border-top: 1px solid var(--border); }
    .file-led { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 5px var(--ok); margin-top: 4px; flex-shrink: 0; animation: blink 3s infinite; }
    .file-path { font-family: var(--mono); font-size: 11px; color: var(--text-dim); word-break: break-all; }

    .meta-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-top: 1px solid var(--border); }
    .meta-k { font-size: 11px; color: var(--text-muted); }
    .meta-v { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  </style>
</head>
<body>

<!-- ── Topbar ──────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="brand">
    <div class="logo">log<em>watch</em></div>
    <div class="pill offline" id="pill"><span class="dot"></span><span id="pill-text">connecting</span></div>
  </div>
  <div class="topbar-right">
    <span class="uptime-badge" id="uptime">—</span>
    <button class="btn" onclick="clearFeed()">🗑 Clear</button>
    <button class="btn btn-primary" onclick="pollStatus()">↺ Refresh</button>
  </div>
</header>

<!-- ── Stats strip ──────────────────────────────────────────────── -->
<div class="stats-strip">
  <div class="stat"><div class="stat-label">Total Alerts</div><div class="stat-val red" id="s-alerts">—</div><div class="stat-sub">since start</div></div>
  <div class="stat"><div class="stat-label">Watched Files</div><div class="stat-val green" id="s-files">—</div><div class="stat-sub">active</div></div>
  <div class="stat"><div class="stat-label">Rules</div><div class="stat-val blue" id="s-rules">—</div><div class="stat-sub">loaded</div></div>
  <div class="stat"><div class="stat-label">Uptime</div><div class="stat-val" id="s-uptime">—</div><div class="stat-sub" id="s-pid">pid —</div></div>
</div>

<!-- ── Main layout ───────────────────────────────────────────────── -->
<div class="layout">

  <!-- left: feed -->
  <div class="left-panel">
    <div class="toolbar">
      <button class="filter on"    onclick="setFilter('ALL',this)">All</button>
      <button class="filter fc"    onclick="setFilter('CRITICAL',this)">🔴 Critical</button>
      <button class="filter fw"    onclick="setFilter('WARN',this)">🟡 Warn</button>
      <button class="filter fi"    onclick="setFilter('INFO',this)">🔵 Info</button>
      <div class="spacer"></div>
      <span class="count-label" id="count-lbl">0 alerts</span>
      <button class="icon-btn" id="pause-btn" onclick="togglePause()" title="Pause">⏸</button>
    </div>
    <div class="feed" id="feed">
      <div class="empty"><div class="empty-icon">👁</div><p>Watching for alerts…</p></div>
    </div>
  </div>

  <!-- right: sidebar -->
  <div class="sidebar">

    <div class="section">
      <div class="section-head">Rules <span class="section-badge" id="rules-badge">—</span></div>
      <div id="rules-body"></div>
    </div>

    <div class="section">
      <div class="section-head">Watched Files</div>
      <div id="files-body"></div>
    </div>

    <div class="section">
      <div class="section-head">Daemon</div>
      <div class="meta-row"><span class="meta-k">PID</span><span class="meta-v" id="m-pid">—</span></div>
      <div class="meta-row"><span class="meta-k">Config</span><span class="meta-v" id="m-cfg" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span></div>
    </div>

  </div>
</div>

<script>
// ── state ──────────────────────────────────────────────────────────
let alerts = [], filter = 'ALL', paused = false, total = 0;
const ruleCounts = {}, MAX = 500;

// ── SSE ────────────────────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource('/api/events');
  es.onopen = () => setOnline(true);
  es.addEventListener('alert', e => onAlert(JSON.parse(e.data)));
  es.onerror = () => { setOnline(false); es.close(); setTimeout(connectSSE, 3000); };
}

function onAlert(a) {
  total++;
  ruleCounts[a.rule] = (ruleCounts[a.rule] || 0) + 1;
  alerts.unshift(a);
  if (alerts.length > MAX) alerts.pop();
  updateStats();
  updateRules();
  if (!paused) renderFeed();
}

// ── status polling ─────────────────────────────────────────────────
function pollStatus() {
  fetch('/api/status').then(r => r.json()).then(s => {
    setOnline(true);
    document.getElementById('s-alerts').textContent = s.alert_count;
    document.getElementById('s-files').textContent  = s.files?.length ?? 0;
    document.getElementById('s-rules').textContent  = s.rule_count;
    document.getElementById('s-uptime').textContent = s.uptime ?? '—';
    document.getElementById('s-pid').textContent    = 'pid ' + s.pid;
    document.getElementById('uptime').textContent   = s.uptime ?? '—';
    document.getElementById('m-pid').textContent    = s.pid;
    document.getElementById('m-cfg').textContent    = s.config_path ?? '—';
    document.getElementById('m-cfg').title          = s.config_path ?? '';
    document.getElementById('rules-badge').textContent = s.rule_count;
    renderFiles(s.files ?? []);
  }).catch(() => setOnline(false));
}

// ── render feed ────────────────────────────────────────────────────
function renderFeed() {
  const el = document.getElementById('feed');
  const list = filter === 'ALL' ? alerts : alerts.filter(a => a.severity === filter);
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">👁</div><p>No ${filter==='ALL'?'':''+filter+' '}alerts yet…</p></div>`;
    return;
  }
  el.innerHTML = list.map((a, i) => buildCard(a, i)).join('');
}

function buildCard(a, idx) {
  const fmtClass = 'fmt-' + (a.format || 'plaintext');
  const fmtLabel = (a.format || 'text').toUpperCase();

  // Core detail rows
  let detail = `
    <div class="detail-grid">
      <span class="dk">time</span>      <span class="dv">${esc(a.time)}</span>
      <span class="dk">severity</span>  <span class="dv ${sevClass(a.severity)}">${esc(a.severity)}</span>
      <span class="dk">level</span>     <span class="dv">${esc(a.level || '—')}</span>
      <span class="dk">rule</span>      <span class="dv blue">${esc(a.rule)}</span>
      <span class="dk">format</span>    <span class="dv">${fmtLabel}</span>
      <span class="dk">source</span>
      <span class="dv">
        <span class="copy-row">
          <span class="copy-val">${esc(a.source || '—')}</span>
          ${a.source ? `<button class="copy-btn" onclick="copyText(this,'${esc(a.source)}')">📋 Copy</button>` : ''}
        </span>
      </span>
    </div>`;

  // Extra parsed fields
  const fields = a.fields && Object.keys(a.fields).length ? a.fields : null;
  if (fields) {
    detail += `<div class="fields-title">Parsed Fields</div>
      <div class="fields-grid">` +
      Object.entries(fields).map(([k,v]) =>
        `<div class="field-chip"><span class="field-k">${esc(k)}</span><span class="field-v">${esc(v)}</span></div>`
      ).join('') +
    `</div>`;
  }

  // Raw line
  if (a.raw) {
    detail += `
      <div class="raw-block">
        <div class="copy-row" style="margin-bottom:6px">
          <span class="raw-label" style="margin:0">Raw Line</span>
          <button class="copy-btn" onclick="copyText(this,${JSON.stringify(a.raw)})">📋 Copy</button>
        </div>
        <div class="raw-text">${esc(a.raw)}</div>
      </div>`;
  }

  return `
    <div class="alert-card ${a.severity}" id="card-${idx}">
      <div class="alert-head" onclick="toggle(${idx})">
        <span class="sev sev-${a.severity}">${a.severity}</span>
        <span class="fmt ${fmtClass}">${fmtLabel}</span>
        <span class="rule-tag">${esc(a.rule)}</span>
        <span class="alert-msg">${esc(a.message)}</span>
        <span class="alert-time">${fmtTime(a.time)}</span>
        <span class="chevron">›</span>
      </div>
      <div class="alert-detail">${detail}</div>
    </div>`;
}

function toggle(idx) {
  const card = document.getElementById('card-' + idx);
  if (card) card.classList.toggle('open');
}

// ── sidebar ─────────────────────────────────────────────────────────
function renderFiles(files) {
  const el = document.getElementById('files-body');
  el.innerHTML = files.length
    ? files.map(f => `<div class="file-row"><span class="file-led"></span><span class="file-path">${esc(f)}</span></div>`).join('')
    : '<div style="padding:10px 16px;font-size:12px;color:var(--text-muted)">No files configured</div>';
}

function updateRules() {
  const el = document.getElementById('rules-body');
  const entries = Object.entries(ruleCounts).sort((a,b) => b[1]-a[1]);
  if (!entries.length) { el.innerHTML = '<div style="padding:10px 16px;font-size:12px;color:var(--text-muted)">No alerts yet</div>'; return; }
  el.innerHTML = entries.map(([name, n]) => `
    <div class="rule-row">
      <div class="rule-info">
        <div class="rule-name">${esc(name)}</div>
      </div>
      <span class="rule-n ${n>0?'hot':''}">${n}</span>
    </div>`).join('');
}

// ── controls ────────────────────────────────────────────────────────
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  updateStats();
  renderFeed();
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pause-btn');
  btn.textContent = paused ? '▶' : '⏸';
  btn.title = paused ? 'Resume' : 'Pause';
  if (!paused) renderFeed();
}

function clearFeed() {
  alerts = []; total = 0;
  Object.keys(ruleCounts).forEach(k => delete ruleCounts[k]);
  updateStats(); updateRules(); renderFeed();
}

// ── helpers ──────────────────────────────────────────────────────────
function updateStats() {
  const visible = filter === 'ALL' ? alerts : alerts.filter(a => a.severity === filter);
  document.getElementById('count-lbl').textContent = visible.length + ' alert' + (visible.length !== 1 ? 's' : '');
  document.getElementById('s-alerts').textContent = total;
}

function setOnline(on) {
  const pill = document.getElementById('pill');
  pill.className = 'pill' + (on ? '' : ' offline');
  document.getElementById('pill-text').textContent = on ? 'running' : 'offline';
}

function sevClass(s) {
  return s === 'CRITICAL' ? 'red' : s === 'WARN' ? 'amber' : 'blue';
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB', { hour12: false });
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 Copy';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── init ─────────────────────────────────────────────────────────────
pollStatus();
setInterval(pollStatus, 10000);
connectSSE();
</script>
