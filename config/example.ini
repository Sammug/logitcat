[watch]
files = /tmp/test.log

[output]
alert_file = /tmp/logwatch-alerts.log
webhook_url =

[rule:error-detected]
pattern = ERROR|FATAL|panic
severity = CRITICAL
action = stdout, file
cooldown = 5

[rule:auth-failure]
pattern = authentication failure|Access denied
severity = WARN
action = stdout, file
cooldown = 10

[rule:disk-warning]
pattern = No space left|disk full
severity = CRITICAL
action = stdout, file
cooldown = 60
