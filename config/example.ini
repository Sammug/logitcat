[watch]
files = /tmp/test.log

[output]
; ── File output ────────────────────────────────────────
alert_file        = /tmp/logwatch-alerts.log

; ── Slack webhook ──────────────────────────────────────
webhook_url       =

; ── Microsoft Teams webhook ────────────────────────────
teams_webhook_url =

; ── Email (SMTP) ───────────────────────────────────────
; smtp_host     = smtp.gmail.com
; smtp_port     = 587              ; 587=STARTTLS, 465=TLS, 25=plain
; smtp_user     = alerts@example.com
; smtp_password = your-app-password
; smtp_from     = logwatch <alerts@example.com>
; smtp_to       = admin@example.com, ops@example.com

[rule:error-detected]
pattern  = ERROR|FATAL|panic
severity = CRITICAL
action   = stdout, file
cooldown = 5

[rule:auth-failure]
pattern  = authentication failure|Access denied
severity = WARN
action   = stdout, file
cooldown = 10

[rule:disk-warning]
pattern  = No space left|disk full
severity = CRITICAL
action   = stdout, file
cooldown = 60

; ── Advanced: JSON-aware rule ──────────────────────────
; [rule:payments-timeout]
