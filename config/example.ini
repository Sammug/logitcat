[watch]
files = /tmp/test.log

[output]
; ── File output ────────────────────────────────────────
alert_file        = /tmp/logwatch-alerts.log

; ── Web dashboard ──────────────────────────────────────
dashboard_addr    = :9090

; ── Slack webhook ──────────────────────────────────────
webhook_url       =

; ── Microsoft Teams webhook ────────────────────────────
teams_webhook_url =

; ── Email (SMTP) ───────────────────────────────────────
; smtp_host     = smtp.gmail.com
; smtp_port     = 587
; smtp_user     = alerts@example.com
; smtp_password = your-app-password
; smtp_to       = admin@example.com

; ── Plaintext rules (matches raw log lines) ────────────
[rule:plaintext-error]
pattern  = ERROR|FATAL|panic
severity = CRITICAL
action   = stdout, file
cooldown = 5

[rule:auth-failure]
pattern  = authentication failure|Access denied
severity = WARN
action   = stdout, file
cooldown = 10

[rule:disk-warning]
pattern  = No space left|disk full
severity = CRITICAL
action   = stdout, file
cooldown = 60

; ── JSON-aware rules (matches parsed fields) ───────────
[rule:json-error]
pattern  = error|fatal
field    = level
severity = CRITICAL
action   = stdout, file
cooldown = 10

[rule:json-warn]
pattern  = warn
field    = level
severity = WARN
action   = stdout, file
cooldown = 10

; ── Apache/Nginx rules ─────────────────────────────────
[rule:http-5xx]
pattern  = 5\d\d
field    = status
severity = CRITICAL
action   = stdout, file
cooldown = 10

[rule:http-4xx]
pattern  = 4\d\d
field    = status
severity = WARN
action   = stdout, file
cooldown = 5
