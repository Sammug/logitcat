[watch]
files = /tmp/test.log

[output]
alert_file        = /tmp/logwatch-alerts.log
webhook_url       =                          ; Slack incoming webhook URL
teams_webhook_url =                          ; MS Teams incoming webhook URL

[rule:error-detected]
pattern  = ERROR|FATAL|panic
severity = CRITICAL
action   = stdout, file
cooldown = 5

[rule:auth-failure]
pattern  = authentication failure|Access denied
severity = WARN
action   = stdout, file
cooldown = 10

[rule:disk-warning]
pattern  = No space left|disk full
severity = CRITICAL
action   = stdout, file
cooldown = 60

; Example: JSON-aware rule — match a specific service field
; [rule:payments-timeout]
; pattern  = payments
; field    = service
; level    = error
; severity = CRITICAL
; action   = stdout, webhook, teams
; cooldown = 30
