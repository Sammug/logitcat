; LogitCat — Android / adb logcat config
; Usage: adb logcat | logitcat pipe config/android.ini --source android

[watch]
; No files — stdin pipe mode only

[output]
stdout     = true
alert_file = /tmp/logitcat-android.log

; ── Crashes & Fatal ──────────────────────────────────────────────────────────

[rule:crash]
pattern  = FATAL EXCEPTION|AndroidRuntime|Process: .* has died
severity = CRITICAL
action   = stdout, file
cooldown = 5

[rule:anr]
pattern  = ANR in|[Aa]pplication [Nn]ot [Rr]esponding|am_anr
severity = CRITICAL
action   = stdout, file
cooldown = 10

[rule:oom]
pattern  = OutOfMemoryError|java\.lang\.OutOfMemory
severity = CRITICAL
action   = stdout, file
cooldown = 10

; ── Exceptions ───────────────────────────────────────────────────────────────

[rule:npe]
pattern  = NullPointerException
severity = CRITICAL
action   = stdout, file
cooldown = 3

[rule:exception]
pattern  = Exception:|Caused by:|java\.|kotlin\.
severity = CRITICAL
action   = stdout, file
cooldown = 3

; ── Network / API ─────────────────────────────────────────────────────────────

[rule:http-error]
pattern  = HTTP (4|5)[0-9][0-9]|response code: [45]|onFailure|NetworkError|ConnectException|SocketTimeout|UnknownHost|SSLException
severity = CRITICAL
action   = stdout, file
cooldown = 5

[rule:retrofit-log]
pattern  = --> (GET|POST|PUT|DELETE|PATCH)|<-- (GET|POST|PUT|DELETE|PATCH)|OkHttp
severity = INFO
action   = stdout, file
cooldown = 1

; ── JSON Structured Logs ─────────────────────────────────────────────────────

[rule:json-error]
pattern  = error|fatal
field    = level
severity = CRITICAL
action   = stdout, file
cooldown = 3

[rule:json-warn]
pattern  = warn
field    = level
severity = WARN
action   = stdout, file
cooldown = 3

[rule:json-info]
pattern  = info
field    = level
severity = INFO
action   = stdout, file
cooldown = 1

[rule:json-debug]
pattern  = debug|verbose
field    = level
severity = INFO
action   = stdout, file
cooldown = 1

; ── Android Log Level Tags ───────────────────────────────────────────────────

[rule:error-tag]
pattern  = ^E/
severity = CRITICAL
action   = stdout, file
cooldown = 2

[rule:warning-tag]
pattern  = ^W/
severity = WARN
action   = stdout, file
cooldown = 2

[rule:info-tag]
pattern  = ^I/
severity = INFO
action   = stdout, file
cooldown = 1

[rule:debug-tag]
pattern  = ^D/
severity = INFO
action   = stdout, file
cooldown = 1

[rule:verbose-tag]
pattern  = ^V/
severity = INFO
action   = stdout, file
cooldown = 1

; ── Database ─────────────────────────────────────────────────────────────────

[rule:room-error]
pattern  = SQLiteException|database.*error|query.*failed|constraint failed|UNIQUE constraint|no such table
severity = CRITICAL
action   = stdout, file
cooldown = 5

[rule:room-query]
pattern  = SELECT|INSERT|UPDATE|DELETE
severity = INFO
action   = stdout, file
cooldown = 1

; ── Firebase ─────────────────────────────────────────────────────────────────

[rule:firebase-error]
pattern  = FirebaseError|Firebase.*failed|Crashlytics
severity = WARN
action   = stdout, file
cooldown = 5

; ── Coroutines ────────────────────────────────────────────────────────────────

[rule:coroutine-error]
pattern  = CoroutineExceptionHandler|JobCancellationException|CancellationException|Exception in coroutine
severity = WARN
action   = stdout, file
cooldown = 3

; ── Lifecycle ────────────────────────────────────────────────────────────────

[rule:lifecycle]
pattern  = onResume|onPause|onCreate|onDestroy|onStop|onStart
severity = INFO
action   = stdout, file
cooldown = 1

[rule:strict-mode]
pattern  = StrictMode|NetworkOnMainThreadException|DiskReadViolation|DiskWriteViolation
severity = WARN
action   = stdout, file
cooldown = 5
