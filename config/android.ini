[logitcat]
source = adb-logcat

[dispatchers]
stdout = true
file = /tmp/logitcat-android.log

# ── Crashes & Fatal ──────────────────────────────────────────────────────────

[rule "crash"]
pattern = FATAL EXCEPTION|AndroidRuntime|Process: .* has died
severity = CRITICAL
cooldown = 5

[rule "anr"]
pattern = ANR in|Application Not Responding|am_anr
severity = CRITICAL
cooldown = 10

[rule "oom"]
pattern = OutOfMemoryError|java\.lang\.OutOfMemory
severity = CRITICAL
cooldown = 10

# ── Exceptions ───────────────────────────────────────────────────────────────

[rule "npe"]
pattern = NullPointerException
severity = CRITICAL
cooldown = 3

[rule "exception"]
pattern = Exception:|Caused by:|java\.|kotlin\.
severity = CRITICAL
cooldown = 3

# ── Network / API ─────────────────────────────────────────────────────────────

[rule "http-error"]
pattern = HTTP (4|5)[0-9][0-9]|response code: [45]|onFailure|NetworkError|ConnectException|SocketTimeout|UnknownHost|SSLException
severity = CRITICAL
cooldown = 5

[rule "retrofit-log"]
pattern = --> (GET|POST|PUT|DELETE|PATCH)|<-- (GET|POST|PUT|DELETE|PATCH)|OkHttp
severity = INFO
cooldown = 1

[rule "api-response-error"]
pattern = "error"|"message"|"status".*false|"success".*false
field = message
severity = WARN
cooldown = 2

# ── JSON Structured Logs ─────────────────────────────────────────────────────

[rule "json-error"]
pattern = error|fatal
field = level
severity = CRITICAL
cooldown = 3

[rule "json-warn"]
pattern = warn
field = level
severity = WARN
cooldown = 3

[rule "json-info"]
pattern = info
field = level
severity = INFO
cooldown = 1

[rule "json-debug"]
pattern = debug|verbose
field = level
severity = INFO
cooldown = 1

# ── Android Log Levels ───────────────────────────────────────────────────────

[rule "error-tag"]
pattern = ^E/
severity = CRITICAL
cooldown = 2

[rule "warning-tag"]
pattern = ^W/
severity = WARN
cooldown = 2

[rule "info-tag"]
pattern = ^I/
severity = INFO
cooldown = 1

[rule "debug-tag"]
pattern = ^D/
severity = INFO
cooldown = 1

[rule "verbose-tag"]
pattern = ^V/
severity = INFO
cooldown = 1

# ── Database ─────────────────────────────────────────────────────────────────

[rule "room-error"]
pattern = SQLiteException|Room|database.*error|query.*failed
severity = CRITICAL
cooldown = 5

[rule "room-query"]
pattern = SELECT|INSERT|UPDATE|DELETE|QUERY
severity = INFO
cooldown = 1

# ── Firebase / Analytics ─────────────────────────────────────────────────────

[rule "firebase-error"]
pattern = FirebaseError|Firebase.*failed|Crashlytics|com\.google\.firebase
severity = WARN
cooldown = 5

# ── Coroutines / Lifecycle ────────────────────────────────────────────────────

[rule "coroutine-error"]
pattern = CoroutineExceptionHandler|JobCancellationException|CancellationException.*cause|DefaultCoroutineExceptionHandler
severity = WARN
cooldown = 3

[rule "lifecycle"]
pattern = onResume|onPause|onCreate|onDestroy|onStop|onStart
severity = INFO
cooldown = 1
