[logitcat]
source = adb-logcat

[dispatchers]
stdout = true
file = /tmp/logitcat-android.log

[rule "crash"]
pattern = FATAL EXCEPTION|AndroidRuntime|Process: .* has died
severity = CRITICAL
cooldown = 5

[rule "anr"]
pattern = ANR in|Application Not Responding|am_anr
severity = CRITICAL
cooldown = 10

[rule "exception"]
pattern = Exception:|Error:|Caused by:
severity = CRITICAL
cooldown = 3

[rule "oom"]
pattern = OutOfMemoryError|java.lang.OutOfMemory
severity = CRITICAL
cooldown = 10

[rule "npe"]
pattern = NullPointerException
severity = CRITICAL
cooldown = 3

[rule "network-error"]
pattern = UnknownHostException|SocketTimeoutException|ConnectException|SSLException
severity = WARN
cooldown = 5

[rule "warning"]
pattern = ^W/
severity = WARN
cooldown = 2

[rule "error-tag"]
pattern = ^E/
severity = CRITICAL
cooldown = 2
